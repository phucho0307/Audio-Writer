<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="Viết truyện cùng AI. Rẽ nhánh câu chuyện. Nghe bản audio miễn phí." />
<meta name="color-scheme" content="light dark" />
<meta property="og:type" content="website" />
<meta property="og:title" content="Audio Writer" />
<meta property="og:description" content="Viết truyện cùng AI. Rẽ nhánh câu chuyện. Nghe bản audio miễn phí." />
<meta property="og:image" content="covers/can-ho-704.svg" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2312606e'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='19' fill='%23e2eff1' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />
<title>Audio Writer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap"
/>

<style>
  /* Layout: one 1040px column. Shelf is a cover-led grid; story and reader are
     single-column text pages with a hairline-separated narration strip, matching
     the product's own chrome. Tokens below are the app's own design system,
     copied from apps/web/app/globals.css rather than re-invented. */
  :root {
    --ground: #f5f7f8;
    --surface: #ffffff;
    --line: #dde3e7;
    --ink: #171a20;
    --muted: #5d6570;
    --accent: #12606e;
    --accent-soft: #e2eff1;
    --warn: #9a5b12;

    --sans: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
    --serif: 'Newsreader', Georgia, serif;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --ground: #0e1116;
      --surface: #161a21;
      --line: #262d37;
      --ink: #e3e8ef;
      --muted: #8f98a6;
      --accent: #58bacb;
      --accent-soft: #14313a;
      --warn: #e0ab55;
      color-scheme: dark;
    }
  }

  :root[data-theme='dark'] {
    --ground: #0e1116;
    --surface: #161a21;
    --line: #262d37;
    --ink: #e3e8ef;
    --muted: #8f98a6;
    --accent: #58bacb;
    --accent-soft: #14313a;
    --warn: #e0ab55;
    color-scheme: dark;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 3px;
  }

  button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
  }

  img {
    max-width: 100%;
    display: block;
  }

  .wrap {
    max-width: 1040px;
    margin: 0 auto;
    padding-inline: 20px;
  }

  /* ---------------------------------------------------------------- chrome */

  header.top {
    border-bottom: 1px solid var(--line);
    background: var(--ground);
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
  }

  .top .wrap {
    display: flex;
    align-items: center;
    gap: 16px;
    padding-block: 13px;
  }

  .brand {
    font-family: var(--serif);
    font-size: 21px;
    letter-spacing: -0.015em;
  }

  .top nav {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-left: auto;
    font-size: 13.5px;
  }

  .top nav button[aria-current='true'] {
    color: var(--accent);
    font-weight: 500;
  }

  .wallet {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px 10px;
    font-variant-numeric: tabular-nums;
  }

  /* A quiet marker rather than a banner: visible to anyone who looks, but it
     no longer sits across the page like a warning. */
  .chip {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px 8px;
  }

  .ticker {
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    overflow: hidden;
  }

  .ticker .wrap {
    padding-block: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12.5px;
    min-height: 34px;
  }

  .pulse {
    width: 6px;
    height: 6px;
    border-radius: 999px;
    background: var(--accent);
    flex: none;
    animation: blip 2.4s ease-in-out infinite;
  }

  @keyframes blip {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }

  .ticker-line {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    transition: opacity 0.4s ease;
  }

  .ticker-line .who {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--accent);
  }

  .ticker-line time {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }

  .live {
    margin-left: auto;
    flex: none;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  /* trending rail */

  .rail {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 2px 18px;
    border-block: 1px solid var(--line);
    padding-block: 12px;
    margin-bottom: 26px;
  }

  .rail-item {
    display: flex;
    align-items: baseline;
    gap: 8px;
    text-align: left;
    padding-block: 4px;
    min-width: 0;
  }

  .rail-item .rank {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    flex: none;
  }

  .rail-item .nm {
    font-size: 13px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }

  .rail-item:hover .nm {
    color: var(--accent);
  }

  .rail-item .n {
    margin-left: auto;
    flex: none;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .spark {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 16px;
    flex: none;
  }

  .spark i {
    width: 3px;
    background: var(--accent);
    opacity: 0.45;
    border-radius: 1px;
  }

  .spark i:last-child {
    opacity: 1;
  }

  /* comments */

  .thread {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .cm {
    display: grid;
    grid-template-columns: 30px 1fr;
    gap: 10px;
  }

  .av {
    width: 30px;
    height: 30px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    display: grid;
    place-items: center;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
  }

  .cm-head {
    display: flex;
    gap: 8px;
    align-items: baseline;
    flex-wrap: wrap;
  }

  .cm-head b {
    font-size: 13px;
    font-weight: 600;
  }

  .cm-head time {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--muted);
  }

  .cm p {
    margin: 2px 0 0;
    font-size: 13.5px;
  }

  .cm .likes {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--muted);
    margin-top: 4px;
  }

  .composer {
    display: flex;
    gap: 10px;
    align-items: center;
    border-top: 1px solid var(--line);
    padding-top: 12px;
  }

  .composer input {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 13.5px;
    background: var(--surface);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 7px 10px;
  }

  .composer input::placeholder {
    color: var(--muted);
  }

  main {
    padding-block: 28px 64px;
  }

  /* ---------------------------------------------------------------- shelf */

  .lede {
    max-width: 48ch;
    margin: 0 0 26px;
  }

  .lede h1 {
    font-family: var(--serif);
    font-size: clamp(27px, 4.4vw, 38px);
    font-weight: 400;
    line-height: 1.15;
    letter-spacing: -0.02em;
    margin: 0 0 8px;
    text-wrap: balance;
  }

  .lede p {
    margin: 0;
    color: var(--muted);
    font-size: 14.5px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(196px, 1fr));
    gap: 26px 22px;
  }

  .card {
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 9px;
    min-width: 0;
  }

  .card .art {
    position: relative;
    aspect-ratio: 600 / 1080;
    max-height: 340px;
    border-radius: 3px;
    overflow: hidden;
    border: 1px solid var(--line);
    background: var(--surface);
  }

  .card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.35s ease;
  }

  .card:hover img {
    transform: scale(1.02);
  }

  .tag {
    position: absolute;
    left: 8px;
    bottom: 8px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 3px 7px;
    border-radius: 2px;
    background: #0b1016cc;
    color: #fff;
    backdrop-filter: blur(3px);
  }

  .tag.locked {
    background: #6b3f08d9;
  }

  .card h3 {
    font-family: var(--serif);
    font-size: 17.5px;
    font-weight: 500;
    margin: 0;
    line-height: 1.25;
  }

  .card:hover h3 {
    color: var(--accent);
  }

  .genres {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  .card p {
    margin: 0;
    font-size: 13px;
    color: var(--muted);
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .meta {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  /* ---------------------------------------------------------------- story */

  .back {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 18px;
  }

  .back:hover {
    color: var(--accent);
  }

  .story-head {
    display: grid;
    grid-template-columns: 190px 1fr;
    gap: 26px;
    align-items: start;
  }

  .story-head .art {
    border: 1px solid var(--line);
    border-radius: 3px;
    overflow: hidden;
    aspect-ratio: 600 / 1080;
  }

  .story-head h1 {
    font-family: var(--serif);
    font-size: clamp(24px, 3.6vw, 32px);
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1.15;
    margin: 0 0 6px;
    text-wrap: balance;
  }

  .byline {
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 14px;
  }

  .synopsis {
    font-family: var(--serif);
    font-size: 16.5px;
    line-height: 1.6;
    margin: 0 0 16px;
    max-width: 58ch;
  }

  .stats {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 18px;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  section.block {
    border-top: 1px solid var(--line);
    margin-top: 28px;
    padding-top: 18px;
  }

  .block-head {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  h2 {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
    margin: 0;
  }

  .link {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
  }

  .link:hover {
    text-decoration: underline;
  }

  .link[disabled] {
    opacity: 0.4;
    cursor: default;
    text-decoration: none;
  }

  /* chapter list */

  ol.chapters {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  ol.chapters li + li {
    border-top: 1px solid var(--line);
  }

  .row {
    display: flex;
    align-items: baseline;
    gap: 12px;
    width: 100%;
    padding-block: 9px;
    text-align: left;
  }

  .row:hover .ch-title {
    color: var(--accent);
  }

  .row[disabled] {
    cursor: default;
  }

  .row[disabled] .ch-title {
    color: var(--muted);
  }

  .num {
    width: 20px;
    flex: none;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .row[aria-current='true'] .num,
  .row[aria-current='true'] .ch-title {
    color: var(--accent);
  }

  .ch-title {
    flex: 1;
    min-width: 0;
    font-size: 14.5px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .dur {
    flex: none;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    min-width: 76px;
    text-align: right;
  }

  /* narration strip */

  .strip {
    border-block: 1px solid var(--line);
    padding-block: 14px;
    display: flex;
    flex-direction: column;
    gap: 11px;
  }

  .strip-row {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .play {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--accent);
  }

  .play:hover {
    text-decoration: underline;
  }

  .settings {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    margin-left: auto;
  }

  .settings:hover {
    color: var(--accent);
  }

  audio {
    width: 100%;
    height: 36px;
  }

  .panel {
    display: flex;
    flex-direction: column;
    gap: 9px;
    padding-top: 2px;
  }

  .vgroup {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 6px 14px;
  }

  .vgroup > .vlabel {
    width: 100%;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
  }

  @media (min-width: 560px) {
    .vgroup > .vlabel {
      width: 104px;
    }
  }

  .voice {
    font-size: 12.5px;
    color: var(--muted);
  }

  .voice:hover {
    color: var(--ink);
  }

  .voice[aria-pressed='true'] {
    color: var(--accent);
    font-weight: 500;
  }

  .rates {
    display: flex;
    gap: 10px;
    margin-left: auto;
  }

  .rate {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .rate[aria-pressed='true'] {
    color: var(--accent);
    font-weight: 500;
  }

  /* progress bar */

  .prog {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
  }

  .prog-head {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .track {
    height: 4px;
    border-radius: 999px;
    background: var(--line);
    overflow: hidden;
  }

  .fill {
    height: 100%;
    border-radius: 999px;
    background: var(--accent);
    width: 4%;
    transition: width 0.3s ease-out;
  }

  .track.mini {
    height: 3px;
    width: 64px;
  }

  @media (prefers-reduced-motion: reduce) {
    .fill,
    .card img {
      transition: none;
    }
  }

  /* paywall + fork tree */

  .notice {
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    background: var(--surface);
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .notice h3 {
    margin: 0;
    font-size: 14.5px;
    font-weight: 600;
  }

  .notice p {
    margin: 0;
    font-size: 13px;
    color: var(--muted);
  }

  .btn {
    align-self: flex-start;
    font-family: var(--mono);
    font-size: 12px;
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 2px;
    padding: 6px 12px;
  }

  .btn:hover {
    background: var(--accent-soft);
  }

  .btn[disabled] {
    opacity: 0.45;
    cursor: default;
  }

  ul.tree {
    list-style: none;
    margin: 0;
    padding: 0;
    font-size: 13.5px;
  }

  ul.tree li {
    display: flex;
    gap: 10px;
    align-items: baseline;
    padding-block: 6px;
  }

  .twig {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    flex: none;
    white-space: pre;
  }

  .tree .who {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }

  .tree .main {
    color: var(--accent);
  }

  /* ---------------------------------------------------------------- reader */

  .reader {
    max-width: 34rem;
    margin: 0 auto;
  }

  .reader-head {
    display: flex;
    align-items: baseline;
    gap: 12px;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .reader h1 {
    font-family: var(--serif);
    font-size: clamp(24px, 3.4vw, 30px);
    font-weight: 400;
    letter-spacing: -0.015em;
    margin: 0 0 18px;
    text-wrap: balance;
  }

  .prose {
    font-family: var(--serif);
    font-size: 18px;
    line-height: 1.72;
  }

  .prose p {
    margin: 0 0 1.05em;
  }

  .pager {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    border-top: 1px solid var(--line);
    margin-top: 26px;
    padding-top: 16px;
    font-family: var(--mono);
    font-size: 12px;
  }

  .pager button {
    color: var(--accent);
    max-width: 46%;
    text-align: left;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .pager button:last-child {
    text-align: right;
  }

  .pager button[disabled] {
    color: var(--muted);
    opacity: 0.5;
    cursor: default;
  }

  footer.foot {
    border-top: 1px solid var(--line);
    margin-top: 44px;
    padding-top: 16px;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--muted);
    display: flex;
    flex-wrap: wrap;
    gap: 6px 18px;
  }

  @media (max-width: 620px) {
    .story-head {
      grid-template-columns: 116px 1fr;
      gap: 16px;
    }
  }
</style>
</head>
<body>


<header class="top">
  <div class="wrap">
    <button class="brand" id="home">Audio Writer</button>
    <nav>
      <button id="nav-shelf" aria-current="true">Khám phá</button>
      <span class="chip" title="Trang giới thiệu: truyện và số liệu là dữ liệu mẫu">demo</span>
      <span class="wallet" id="wallet">— credit</span>
    </nav>
  </div>
</header>

<div class="ticker">
  <div class="wrap">
    <span class="pulse" aria-hidden="true"></span>
    <span class="ticker-line" id="ticker" aria-live="off"></span>
    <span class="live" id="live"></span>
  </div>
</div>

<main class="wrap" id="app">
  <div class="lede">
    <h1>Đang tải kệ truyện…</h1>
  </div>
</main>

<script>
  (function () {
    'use strict';

    // Audio Writer demo: the product's three screens (shelf, story, reader)
    // over seeded data. Two of the clips are real output from the narration
    // pipeline; the rest reuse them, which is why the ribbon says so.

    var VOICES = [
      { id: 'Kore', label: 'Kore · nữ, trầm ấm', p: 'gemini' },
      { id: 'Aoede', label: 'Aoede · nữ, nhẹ', p: 'gemini' },
      { id: 'Charon', label: 'Charon · nam, trầm', p: 'gemini' },
      { id: 'Puck', label: 'Puck · nam, linh hoạt', p: 'gemini' },
      { id: 'piper:vais1000@1', label: 'Vais1000 · tự nhiên', p: 'piper' },
      { id: 'piper:vais1000@1.5', label: 'Vais1000 · chậm vừa', p: 'piper' },
      { id: 'piper:vais1000@2', label: 'Vais1000 · chậm', p: 'piper' },
      { id: 'piper:25hours@1', label: '25hours · tự nhiên', p: 'piper' },
      { id: 'piper:25hours@1.5', label: '25hours · chậm vừa', p: 'piper' },
      { id: 'piper:vivos#0@1.3', label: 'VIVOS 1 · vừa', p: 'piper' },
      { id: 'piper:vivos#20@1.3', label: 'VIVOS 2 · vừa', p: 'piper' },
    ];

    var GROUPS = [
      { p: 'gemini', title: 'Gemini' },
      { p: 'piper', title: 'Piper · tự chạy' },
    ];

    // Seeded per story: reads, price, forks. Demo numbers, not measurements.
    var SEED = {
      'can-ho-704': {
        reads: 18420,
        price: 0,
        forks: [
          { name: 'Nếu Hằng không mở cửa', who: '@linhmai', at: 3, len: 11 },
          { name: 'Góc nhìn người ở trước', who: '@thao.ng', at: 5, len: 6 },
        ],
      },
      'trong-sinh-ngay-bi-hai': {
        reads: 31067,
        price: 10,
        forks: [{ name: 'Nàng tha thứ', who: '@cucai', at: 4, len: 9 }],
      },
      'he-thong-san-quy': {
        reads: 12894,
        price: 0,
        forks: [{ name: 'Đơn hàng thứ hai', who: '@bequan', at: 2, len: 14 }],
      },
      'xuyen-viet-trong-rau': { reads: 9531, price: 0, forks: [] },
      'mat-the-ngay-thu-bay': {
        reads: 7742,
        price: 8,
        forks: [{ name: 'Cô trả lời', who: '@mint', at: 6, len: 5 }],
      },
      'co-dai-y-nu': { reads: 15310, price: 12, forks: [] },
    };

    // Fictional handles for the demo's activity feed and comment threads.
    var HANDLES = [
      'linhmai', 'thao.ng', 'cucai', 'bequan', 'mint', 'haiyen',
      'docgia_2k3', 'trangiang', 'nhim.con', 'quynhanh',
    ];

    var ACTIVITY = [
      { t: 'vừa nghe xong', what: 'chương' },
      { t: 'vừa mở khoá', what: 'truyện' },
      { t: 'vừa rẽ nhánh từ', what: 'chương' },
      { t: 'vừa bình luận ở', what: 'chương' },
      { t: 'vừa thêm vào kệ', what: 'truyện' },
    ];

    var COMMENTS = [
      'Đoạn này đọc xong không dám tắt đèn.',
      'Giọng đọc nghe lúc đêm hợp kinh khủng.',
      'Tui đoán được twist rồi mà vẫn sợ.',
      'Chương sau ra chưa tác giả ơi 😭',
      'Nhánh của @linhmai hay hơn bản gốc, thật lòng.',
      'Nghe trên đường đi làm, suýt lỡ bến.',
      'Cách tả cái hộp thiếc ám ảnh thật sự.',
      'Đọc lại lần hai mới thấy chi tiết sợi tóc được gài từ đầu.',
      'Ai nghe bản Vais1000 chưa, nghe đỡ gấp hơn.',
      'Mình mở khoá luôn cả truyện, không chịu được nữa.',
    ];

    var FREE_CHAPTERS = 3;
    var PRERENDERED = 3; // what publishing renders ahead of the first reader
    var WPM = 157; // the cloud voice's measured pace
    var AUTHOR = 'Hồ Tấn Phúc';

    var app = document.getElementById('app');
    var walletEl = document.getElementById('wallet');

    var state = {
      stories: [],
      view: 'shelf',
      slug: null,
      ch: 0,
      voice: 'Kore',
      rate: 1,
      panel: false,
      credits: 20,
      unlocked: {},
      ready: {}, // "slug:ch:voice" -> true once narrated in this session
      job: null,
      posted: {}, // comments the viewer adds, per chapter
      listeners: {},
    };

    /* ------------------------------------------------------------ storage */

    function load() {
      try {
        var raw = localStorage.getItem('aw-demo');
        if (!raw) return;
        var saved = JSON.parse(raw);
        if (typeof saved.credits === 'number') state.credits = saved.credits;
        if (saved.unlocked) state.unlocked = saved.unlocked;
        if (saved.voice) state.voice = saved.voice;
      } catch (err) {
        /* private window, or site data blocked - defaults are fine */
      }
    }

    function save() {
      try {
        localStorage.setItem(
          'aw-demo',
          JSON.stringify({
            credits: state.credits,
            unlocked: state.unlocked,
            voice: state.voice,
          }),
        );
      } catch (err) {
        /* nothing to do - the page works without it */
      }
    }

    /* ------------------------------------------------------------ helpers */

    function esc(s) {
      return String(s).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }

    function mmss(sec) {
      var s = Math.round(sec);
      return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    }

    function thousands(n) {
      return n.toLocaleString('vi-VN');
    }

    function story(slug) {
      for (var i = 0; i < state.stories.length; i++) {
        if (state.stories[i].slug === slug) return state.stories[i];
      }
      return null;
    }

    function seedOf(slug) {
      return SEED[slug] || { reads: 0, price: 0, forks: [] };
    }

    /** Deterministic pseudo-random, so the same story keeps the same shape. */
    function hash(str) {
      var h = 2166136261;
      for (var i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return function () {
        h = Math.imul(h ^ (h >>> 15), 2246822507);
        h = Math.imul(h ^ (h >>> 13), 3266489909);
        return ((h ^= h >>> 16) >>> 0) / 4294967296;
      };
    }

    function weekly(slug) {
      var rand = hash(slug);
      var bars = [];
      for (var i = 0; i < 7; i++) bars.push(0.35 + rand() * 0.65);
      return bars;
    }

    function pick(list, rand) {
      return list[Math.floor(rand() * list.length)];
    }

    function commentsFor(slug, i) {
      var rand = hash(slug + ':' + i);
      var n = 2 + Math.floor(rand() * 3);
      var out = [];
      var used = {};
      for (var k = 0; k < n; k++) {
        var who = pick(HANDLES, rand);
        var body = pick(COMMENTS, rand);
        if (used[body]) continue;
        used[body] = true;
        out.push({
          who: who,
          body: body,
          mins: 8 + Math.floor(rand() * 2600),
          likes: Math.floor(rand() * 46),
        });
      }
      out.sort(function (a, b) { return a.mins - b.mins; });
      return out;
    }

    function ago(mins) {
      if (mins < 60) return mins + ' phút trước';
      if (mins < 1440) return Math.round(mins / 60) + ' giờ trước';
      return Math.round(mins / 1440) + ' ngày trước';
    }

    function isUnlocked(slug) {
      return seedOf(slug).price === 0 || state.unlocked[slug] === true;
    }

    function locked(slug, i) {
      return i >= FREE_CHAPTERS && !isUnlocked(slug);
    }

    function voiceLabel(id) {
      for (var i = 0; i < VOICES.length; i++) {
        if (VOICES[i].id === id) return VOICES[i].label;
      }
      return id;
    }

    function clipFor(i) {
      return i % 2 === 0 ? './audio/s1.mp4' : './audio/s2.mp4';
    }

    function readyKey(slug, i) {
      return slug + ':' + i + ':' + state.voice;
    }

    // Pre-rendered on publish, so the first chapters play with no wait. Deeper
    // ones are synthesised on demand - the case the progress bar exists for.
    function hasAudio(slug, i) {
      if (state.ready[readyKey(slug, i)]) return true;
      return state.voice === 'Kore' && i < PRERENDERED;
    }

    /** Real estimate for the chosen engine, in ms. */
    function estimate(ch) {
      if (state.voice.indexOf('piper:') === 0) {
        var pace = Number((/@([\d.]+)$/.exec(state.voice) || [0, 1])[1]);
        var speech = (ch.words / 276) * 60 * (1 + 0.55 * (pace - 1));
        return Math.round((speech / 5 + 3) * 1000);
      }
      return Math.round(20000 + ch.text.length * 6);
    }

    /* -------------------------------------------------------------- live */

    /**
     * Listener counts that drift, and a feed of things happening.
     *
     * Both are generated in the browser from the seeded numbers: there is no
     * server here and nobody else is reading. A page that shows a frozen
     * "0 đang nghe" reads as broken, so the demo shows plausible movement and
     * says in the header that the data is sample data.
     */
    function startLive() {
      state.stories.forEach(function (s) {
        var rand = hash(s.slug + ':live');
        state.listeners[s.slug] = 40 + Math.floor(rand() * (seedOf(s.slug).reads / 180));
      });
      paintLive();
      setInterval(drift, 4200);

      tickerNext();
      setInterval(tickerNext, 5200);
    }

    function drift() {
      state.stories.forEach(function (s) {
        var n = state.listeners[s.slug];
        var step = Math.round((Math.random() - 0.45) * Math.max(3, n * 0.05));
        state.listeners[s.slug] = Math.max(11, n + step);
      });
      paintLive();
    }

    function paintLive() {
      var total = 0;
      state.stories.forEach(function (s) {
        total += state.listeners[s.slug];
      });
      var live = document.getElementById('live');
      if (live) live.textContent = thousands(total) + ' người đang nghe';

      var nodes = document.querySelectorAll('[data-live]');
      for (var i = 0; i < nodes.length; i++) {
        var slug = nodes[i].getAttribute('data-live');
        nodes[i].textContent = thousands(state.listeners[slug] || 0) + ' đang nghe';
      }
    }

    function tickerNext() {
      var el = document.getElementById('ticker');
      if (!el || !state.stories.length) return;
      var rand = hash(String(Date.now()));
      var s = state.stories[Math.floor(rand() * state.stories.length)];
      var act = pick(ACTIVITY, rand);
      var ch = 1 + Math.floor(rand() * s.chapters.length);
      var line =
        '<span class="who">@' +
        esc(pick(HANDLES, rand)) +
        '</span> ' +
        act.t +
        ' ' +
        (act.what === 'chương' ? 'chương ' + ch + ' của ' : '') +
        '<b>' +
        esc(s.title) +
        '</b> <time>' +
        (1 + Math.floor(rand() * 40)) +
        ' phút trước</time>';

      el.style.opacity = '0';
      setTimeout(function () {
        el.innerHTML = line;
        el.style.opacity = '1';
      }, 260);
    }

    /* ------------------------------------------------------------ chrome */

    function paintWallet() {
      walletEl.textContent = state.credits + ' credit';
    }

    function go(view, slug, ch) {
      stopAudio();
      state.view = view;
      state.slug = slug === undefined ? state.slug : slug;
      state.ch = ch === undefined ? 0 : ch;
      state.panel = false;
      render();
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    /* ------------------------------------------------------------- audio */

    var audio = null;

    function stopAudio() {
      if (state.job) {
        clearInterval(state.job.timer);
        state.job = null;
      }
      if (audio) {
        audio.pause();
        audio = null;
      }
    }

    /**
     * The product's progress model, kept as it is in the app: open at 4%, rise
     * fast and flatten, stop at 94%, and only reach 100% when the audio is
     * actually there. Here the wait is compressed so the demo stays usable.
     */
    function synthesise(slug, i, done) {
      var ch = story(slug).chapters[i];
      var real = estimate(ch);
      var wait = Math.min(Math.max(real / 7, 2200), 6000);
      var t0 = performance.now();

      state.job = {
        slug: slug,
        ch: i,
        p: 0.04,
        queued: true,
        real: real,
        timer: setInterval(tick, 140),
      };
      tick();

      function tick() {
        var job = state.job;
        if (!job) return;
        var t = performance.now() - t0;
        if (job.queued && t > wait * 0.18) job.queued = false;

        var next;
        if (job.queued) {
          next = 0.04 + 0.1 * (1 - Math.exp(-t / 900));
        } else {
          next = 0.14 + 0.8 * (1 - Math.exp((-2.3 * (t - wait * 0.18)) / wait));
        }
        job.p = Math.max(job.p, next);

        if (t >= wait) {
          job.p = 1;
          paintProgress();
          clearInterval(job.timer);
          state.job = null;
          state.ready[readyKey(slug, i)] = true;
          setTimeout(function () {
            if (state.slug === slug) done();
          }, 420);
          return;
        }
        paintProgress();
      }
    }

    function paintProgress() {
      var job = state.job;
      var fill = document.querySelector('[data-fill]');
      if (!fill) return;
      var pct = Math.round((job ? job.p : 1) * 100);
      fill.style.width = pct + '%';
      var label = document.querySelector('[data-pct]');
      if (label) label.textContent = pct + '%';
      var msg = document.querySelector('[data-msg]');
      if (msg) msg.textContent = progressText(job, pct);
    }

    function progressText(job, pct) {
      if (!job) return 'Xong rồi';
      if (job.queued) return 'Đang xếp hàng…';
      if (pct < 30) return 'Đang chuẩn bị giọng đọc…';
      if (pct < 62) return 'Đang đọc chương truyện…';
      if (pct < 85) return 'Đang hoàn thiện âm thanh…';
      return 'Sắp xong rồi…';
    }

    function playChapter(slug, i) {
      if (hasAudio(slug, i)) {
        state.ready[readyKey(slug, i)] = true;
        render();
        setTimeout(function () {
          var el = document.querySelector('audio');
          if (el) {
            audio = el;
            el.playbackRate = state.rate;
            el.play().catch(function () {
              /* the viewer will press play themselves */
            });
          }
        }, 40);
        return;
      }
      render();
      synthesise(slug, i, function () {
        playChapter(slug, i);
      });
    }

    /* -------------------------------------------------------------- views */

    function render() {
      paintWallet();
      if (state.view === 'shelf') app.innerHTML = shelf();
      else if (state.view === 'story') app.innerHTML = storyView();
      else app.innerHTML = reader();
      document.getElementById('nav-shelf').setAttribute(
        'aria-current',
        state.view === 'shelf' ? 'true' : 'false',
      );
      paintLive();
    }

    function shelf() {
      var cards = state.stories
        .map(function (s) {
          var seed = seedOf(s.slug);
          var mins = Math.round(s.words / WPM);
          var tag = seed.price
            ? '<span class="tag locked">' + seed.price + ' credit</span>'
            : '<span class="tag">Miễn phí</span>';
          return (
            '<button class="card" data-story="' +
            s.slug +
            '">' +
            '<div class="art">' +
            '<img src="./covers/' +
            s.slug +
            '.svg" alt="Bìa truyện ' +
            esc(s.title) +
            '" width="600" height="1080" loading="lazy" />' +
            tag +
            '</div>' +
            '<div class="genres">' +
            esc(s.genres.join(' · ')) +
            '</div>' +
            '<h3>' +
            esc(s.title) +
            '</h3>' +
            '<p>' +
            esc(s.synopsis) +
            '</p>' +
            '<div class="meta">' +
            s.chapters.length +
            ' chương · ' +
            mins +
            ' phút đọc · ' +
            thousands(seed.reads) +
            ' lượt đọc</div>' +
            '</button>'
          );
        })
        .join('');

      var ranked = state.stories
        .slice()
        .sort(function (a, b) {
          return seedOf(b.slug).reads - seedOf(a.slug).reads;
        })
        .slice(0, 4)
        .map(function (s, n) {
          var bars = weekly(s.slug)
            .map(function (h) {
              return '<i style="height:' + Math.round(h * 16) + 'px"></i>';
            })
            .join('');
          return (
            '<button class="rail-item" data-story="' +
            s.slug +
            '">' +
            '<span class="rank">' +
            (n + 1) +
            '</span><span class="nm">' +
            esc(s.title) +
            '</span>' +
            '<span class="spark" aria-hidden="true">' +
            bars +
            '</span>' +
            '<span class="n" data-live="' +
            s.slug +
            '">—</span></button>'
          );
        })
        .join('');

      return (
        '<div class="lede">' +
        '<h1>Truyện người viết, AI viết tiếp, ai cũng nghe được.</h1>' +
        '<p>Ba chương đầu của mọi truyện đều có bản đọc sẵn, miễn phí. ' +
        'Thích một nhánh khác? Rẽ nhánh và viết tiếp theo ý bạn.</p>' +
        '</div>' +
        '<div class="rail">' +
        ranked +
        '</div>' +
        '<div class="grid">' +
        cards +
        '</div>' +
        foot()
      );
    }

    function storyView() {
      var s = story(state.slug);
      var seed = seedOf(s.slug);
      var mins = Math.round(s.words / WPM);
      var open = isUnlocked(s.slug);

      var rows = s.chapters
        .map(function (c, i) {
          var isLocked = locked(s.slug, i);
          var dur = mmss((c.words / WPM) * 60);
          var right = isLocked
            ? '🔒 ' + seed.price + ' credit'
            : hasAudio(s.slug, i)
              ? '♪ ' + dur
              : dur;
          return (
            '<li><button class="row" data-ch="' +
            i +
            '"' +
            (isLocked ? ' disabled' : '') +
            '>' +
            '<span class="num">' +
            (i + 1) +
            '</span>' +
            '<span class="ch-title">' +
            esc(c.title) +
            '</span>' +
            '<span class="dur">' +
            right +
            '</span>' +
            '</button></li>'
          );
        })
        .join('');

      var paywall = open
        ? ''
        : '<div class="notice">' +
          '<h3>Mở khoá ' +
          seed.price +
          ' credit để đọc hết</h3>' +
          '<p>Ba chương đầu luôn miễn phí. Mở khoá một lần, đọc và nghe mãi mãi — ' +
          'người viết nhận 70% số credit đó.</p>' +
          '<button class="btn" id="unlock"' +
          (state.credits < seed.price ? ' disabled' : '') +
          '>' +
          (state.credits < seed.price
            ? 'Không đủ credit (' + state.credits + ')'
            : 'Mở khoá · ' + seed.price + ' credit') +
          '</button>' +
          '</div>';

      var tree =
        '<ul class="tree">' +
        '<li><span class="twig">┌─</span><span class="main">' +
        esc(s.title) +
        '</span><span class="who">' +
        esc(AUTHOR) +
        ' · ' +
        s.chapters.length +
        ' chương · nhánh chính</span></li>' +
        seed.forks
          .map(function (f, n) {
            var last = n === seed.forks.length - 1;
            return (
              '<li><span class="twig">' +
              (last ? '└─' : '├─') +
              '</span><span>' +
              esc(f.name) +
              '</span><span class="who">' +
              esc(f.who) +
              ' · rẽ từ chương ' +
              f.at +
              ' · ' +
              f.len +
              ' chương</span></li>'
            );
          })
          .join('') +
        '</ul>';

      return (
        '<button class="back" id="back">← Khám phá</button>' +
        '<div class="story-head">' +
        '<div class="art"><img src="./covers/' +
        s.slug +
        '.svg" alt="Bìa truyện ' +
        esc(s.title) +
        '" width="600" height="1080" /></div>' +
        '<div>' +
        '<h1>' +
        esc(s.title) +
        '</h1>' +
        '<p class="byline">' +
        esc(AUTHOR) +
        ' · ' +
        esc(s.genres.join(', ')) +
        '</p>' +
        '<p class="synopsis">' +
        esc(s.synopsis) +
        '</p>' +
        '<div class="stats">' +
        '<span>' +
        s.chapters.length +
        ' chương</span><span>' +
        thousands(s.words) +
        ' từ</span><span>' +
        mins +
        ' phút</span><span>' +
        thousands(seed.reads) +
        ' lượt đọc</span>' +
        '<span data-live="' +
        s.slug +
        '">—</span>' +
        (open ? '<span>Đã mở khoá</span>' : '') +
        '</div>' +
        '</div></div>' +
        (paywall ? '<section class="block">' + paywall + '</section>' : '') +
        '<section class="block">' +
        '<div class="block-head"><h2>Bản đọc</h2>' +
        '<button class="link" id="listen">♪ Nghe từ chương 1</button>' +
        '<button class="settings" id="toggle">' +
        esc(voiceLabel(state.voice)) +
        ' · ' +
        state.rate +
        '× ' +
        (state.panel ? '▴' : '▾') +
        '</button>' +
        '</div>' +
        (state.panel ? panel() : '') +
        '<ol class="chapters">' +
        rows +
        '</ol>' +
        '</section>' +
        '<section class="block">' +
        '<div class="block-head"><h2>Các nhánh</h2>' +
        '<button class="link" id="fork">Rẽ nhánh truyện này</button></div>' +
        tree +
        '</section>' +
        foot()
      );
    }

    function reader() {
      var s = story(state.slug);
      var i = state.ch;
      var c = s.chapters[i];
      var paras = c.text
        .split(/\n\n+/)
        .map(function (p) {
          return '<p>' + esc(p) + '</p>';
        })
        .join('');

      var strip;
      if (state.job && state.job.slug === s.slug && state.job.ch === i) {
        strip =
          '<div class="prog">' +
          '<div class="prog-head"><span data-msg>Đang xếp hàng…</span><span data-pct>4%</span></div>' +
          '<div class="track"><div class="fill" data-fill></div></div>' +
          '</div>';
      } else if (hasAudio(s.slug, i)) {
        strip =
          '<audio controls preload="auto" src="' +
          clipFor(i) +
          '"></audio>' +
          '<div class="strip-row">' +
          '<span class="meta">' +
          mmss((c.words / WPM) * 60) +
          ' · ' +
          esc(voiceLabel(state.voice)) +
          '</span>' +
          '<button class="settings" id="toggle">' +
          state.rate +
          '× ' +
          (state.panel ? '▴' : '▾') +
          '</button></div>';
      } else {
        strip =
          '<div class="strip-row">' +
          '<button class="play" id="narrate">♪ nghe chương này</button>' +
          '<button class="settings" id="toggle">' +
          esc(voiceLabel(state.voice)) +
          ' · ' +
          state.rate +
          '× ' +
          (state.panel ? '▴' : '▾') +
          '</button></div>';
      }

      var prevOk = i > 0;
      var nextOk = i + 1 < s.chapters.length && !locked(s.slug, i + 1);

      return (
        '<div class="reader">' +
        '<button class="back" id="back-story">← ' +
        esc(s.title) +
        '</button>' +
        '<div class="reader-head"><span>Chương ' +
        (i + 1) +
        '/' +
        s.chapters.length +
        '</span><span>' +
        thousands(c.words) +
        ' từ</span></div>' +
        '<h1>' +
        esc(c.title) +
        '</h1>' +
        '<div class="strip">' +
        strip +
        (state.panel ? panel() : '') +
        '</div>' +
        '<div class="prose">' +
        paras +
        '</div>' +
        thread(s.slug, i) +
        '<div class="pager">' +
        '<button data-go="' +
        (i - 1) +
        '"' +
        (prevOk ? '' : ' disabled') +
        '>' +
        (prevOk ? '← ' + esc(s.chapters[i - 1].title) : '← Chương đầu') +
        '</button>' +
        '<button data-go="' +
        (i + 1) +
        '"' +
        (nextOk ? '' : ' disabled') +
        '>' +
        (nextOk
          ? esc(s.chapters[i + 1].title) + ' →'
          : i + 1 < s.chapters.length
            ? '🔒 Cần mở khoá'
            : 'Hết truyện') +
        '</button>' +
        '</div>' +
        foot() +
        '</div>'
      );
    }

    function thread(slug, i) {
      var list = commentsFor(slug, i);
      var mine = (state.posted[slug + ':' + i] || []).map(function (body) {
        return { who: 'bạn', body: body, mins: 0, likes: 0 };
      });
      var items = mine
        .concat(list)
        .map(function (c) {
          return (
            '<div class="cm">' +
            '<div class="av" aria-hidden="true">' +
            esc(c.who.slice(0, 2)) +
            '</div><div><div class="cm-head"><b>' +
            (c.who === 'bạn' ? 'Bạn' : '@' + esc(c.who)) +
            '</b><time>' +
            (c.mins === 0 ? 'vừa xong' : ago(c.mins)) +
            '</time></div>' +
            '<p>' +
            esc(c.body) +
            '</p>' +
            '<div class="likes">♥ ' +
            c.likes +
            '</div></div></div>'
          );
        })
        .join('');

      return (
        '<section class="block"><div class="block-head"><h2>Bình luận · ' +
        (list.length + mine.length) +
        '</h2></div>' +
        '<div class="thread">' +
        items +
        '<div class="composer">' +
        '<input id="say" placeholder="Viết bình luận…" autocomplete="off" />' +
        '<button class="btn" id="post">Gửi</button>' +
        '</div></div></section>'
      );
    }

    function panel() {
      var groups = GROUPS.map(function (g) {
        var items = VOICES.filter(function (v) {
          return v.p === g.p;
        })
          .map(function (v) {
            return (
              '<button class="voice" data-voice="' +
              v.id +
              '" aria-pressed="' +
              (state.voice === v.id) +
              '">' +
              esc(v.label) +
              '</button>'
            );
          })
          .join('');
        return (
          '<div class="vgroup"><span class="vlabel">' +
          g.title +
          '</span>' +
          items +
          '</div>'
        );
      }).join('');

      var rates = [1, 1.25, 1.5, 1.75, 2]
        .map(function (r) {
          return (
            '<button class="rate" data-rate="' +
            r +
            '" aria-pressed="' +
            (state.rate === r) +
            '">' +
            r +
            '×</button>'
          );
        })
        .join('');

      return (
        '<div class="panel">' +
        groups +
        '<div class="vgroup"><span class="vlabel">Tốc độ</span><div class="rates">' +
        rates +
        '</div></div>' +
        '</div>'
      );
    }

    function foot() {
      return (
        '<footer class="foot">' +
        '<span>Bản đọc tạo sẵn 3 chương khi xuất bản</span>' +
        '<span>Chương tiếp theo được tạo trước khi bạn nghe tới</span>' +
        '<span>Giọng đọc: Gemini hoặc Piper tự chạy</span>' +
        '</footer>'
      );
    }

    /* ------------------------------------------------------------ events */

    document.addEventListener('click', function (e) {
      var t = e.target.closest('button');
      if (!t) return;

      if (t.id === 'home' || t.id === 'nav-shelf' || t.id === 'back') {
        go('shelf', null);
      } else if (t.dataset.story) {
        go('story', t.dataset.story);
      } else if (t.id === 'back-story') {
        go('story', state.slug);
      } else if (t.dataset.ch !== undefined) {
        go('reader', state.slug, Number(t.dataset.ch));
      } else if (t.dataset.go !== undefined) {
        go('reader', state.slug, Number(t.dataset.go));
      } else if (t.id === 'toggle') {
        state.panel = !state.panel;
        render();
      } else if (t.dataset.voice) {
        state.voice = t.dataset.voice;
        save();
        render();
      } else if (t.dataset.rate) {
        state.rate = Number(t.dataset.rate);
        var el = document.querySelector('audio');
        if (el) el.playbackRate = state.rate;
        render();
      } else if (t.id === 'narrate') {
        playChapter(state.slug, state.ch);
      } else if (t.id === 'listen') {
        go('reader', state.slug, 0);
        playChapter(state.slug, 0);
      } else if (t.id === 'unlock') {
        var price = seedOf(state.slug).price;
        if (state.credits >= price) {
          state.credits -= price;
          state.unlocked[state.slug] = true;
          save();
          render();
        }
      } else if (t.id === 'post') {
        var box = document.getElementById('say');
        var text = box && box.value.trim();
        if (text) {
          var key = state.slug + ':' + state.ch;
          state.posted[key] = [text].concat(state.posted[key] || []);
          render();
        }
      } else if (t.id === 'fork') {
        var seed = seedOf(state.slug);
        seed.forks = seed.forks.concat([
          {
            name: 'Nhánh của bạn',
            who: 'bạn',
            at: Math.min(FREE_CHAPTERS, story(state.slug).chapters.length),
            len: 0,
          },
        ]);
        render();
      }
    });

    /* -------------------------------------------------------------- boot */

    load();
    paintWallet();

    fetch('./data/stories.json')
      .then(function (r) {
        return r.json();
      })
      .then(function (data) {
        state.stories = data;
        render();
        startLive();
      })
      .catch(function () {
        app.innerHTML =
          '<div class="lede"><h1>Không tải được dữ liệu truyện</h1>' +
          '<p>Thử tải lại trang.</p></div>';
      });
  })();
</script>

</body>
</html>
