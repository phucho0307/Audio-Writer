<style>
  /* Audio Writer — reader for Vietnamese serial fiction.
     Layout: a 1120px column. The shelf opens on one featured story using its own
     cover as atmosphere; everything else stays quiet so the covers carry the
     colour. A player docks at the bottom and survives navigation, because people
     browse while they listen.
     Type: Newsreader for anything story-voiced (titles, prose), Plex Sans for
     interface, Plex Mono for counts and labels. Palette is the product's teal on
     warm paper, with a deeper ink at night so the dark covers sit inside it. */
  :root {
    --paper: #f6f5f2;
    --card: #fffefc;
    --sunk: #eceae5;
    --line: #ddd9d1;
    --line-soft: #e7e4dd;
    --ink: #15181d;
    --ink-2: #4a5159;
    --muted: #767d86;
    --accent: #0f5f6b;
    --accent-ink: #0b4852;
    --accent-soft: #e2eef0;
    --gold: #8a5a16;
    --gold-soft: #f6ecda;
    --shadow: 0 1px 2px rgba(20, 24, 28, 0.05), 0 8px 24px -12px rgba(20, 24, 28, 0.18);
    --shadow-lift: 0 2px 4px rgba(20, 24, 28, 0.06), 0 18px 40px -16px rgba(20, 24, 28, 0.3);

    --sans: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
    --serif: 'Newsreader', Georgia, 'Times New Roman', serif;
    --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', monospace;

    --r: 10px;
    --r-sm: 6px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --paper: #0c0f13;
      --card: #14181e;
      --sunk: #191e25;
      --line: #262c35;
      --line-soft: #1f252d;
      --ink: #e8ebef;
      --ink-2: #b2bac4;
      --muted: #828b97;
      --accent: #5bc0d0;
      --accent-ink: #9adbe6;
      --accent-soft: #11313a;
      --gold: #dcae63;
      --gold-soft: #2a2114;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 10px 30px -14px rgba(0, 0, 0, 0.8);
      --shadow-lift: 0 2px 6px rgba(0, 0, 0, 0.55), 0 22px 48px -18px rgba(0, 0, 0, 0.9);
      color-scheme: dark;
    }
  }

  :root[data-theme='dark'] {
    --paper: #0c0f13;
    --card: #14181e;
    --sunk: #191e25;
    --line: #262c35;
    --line-soft: #1f252d;
    --ink: #e8ebef;
    --ink-2: #b2bac4;
    --muted: #828b97;
    --accent: #5bc0d0;
    --accent-ink: #9adbe6;
    --accent-soft: #11313a;
    --gold: #dcae63;
    --gold-soft: #2a2114;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 10px 30px -14px rgba(0, 0, 0, 0.8);
    --shadow-lift: 0 2px 6px rgba(0, 0, 0, 0.55), 0 22px 48px -18px rgba(0, 0, 0, 0.9);
    color-scheme: dark;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  ::selection {
    background: var(--accent-soft);
    color: var(--accent-ink);
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 4px;
  }

  button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
  }

  img {
    max-width: 100%;
    display: block;
  }

  .wrap {
    max-width: 1120px;
    margin: 0 auto;
    padding-inline: 22px;
  }

  /* ------------------------------------------------------------- top bar */

  header.top {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 40;
    background: var(--paper);
    border-bottom: 1px solid var(--line-soft);
  }

  .top .wrap {
    display: flex;
    align-items: center;
    gap: 14px;
    padding-block: 12px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
    letter-spacing: -0.02em;
  }

  .mark {
    width: 26px;
    height: 26px;
    border-radius: 7px;
    background: linear-gradient(145deg, var(--accent), var(--accent-ink));
    color: var(--card);
    display: grid;
    place-items: center;
    font-family: var(--serif);
    font-size: 15px;
    line-height: 1;
    flex: none;
    box-shadow: var(--shadow);
  }

  .brand .nm {
    font-family: var(--serif);
    font-size: 20px;
    font-weight: 500;
  }

  .top nav {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-left: auto;
  }

  .navlink {
    font-size: 13.5px;
    color: var(--ink-2);
    padding: 4px 2px;
    white-space: nowrap;
  }

  .navlink:hover {
    color: var(--accent);
  }

  .navlink[aria-current='true'] {
    color: var(--accent);
    font-weight: 500;
    box-shadow: inset 0 -2px 0 var(--accent);
  }

  .empty {
    border: 1px dashed var(--line);
    border-radius: var(--r);
    padding: 34px 24px;
    text-align: center;
    color: var(--muted);
  }

  .empty h3 {
    font-family: var(--serif);
    font-size: 19px;
    font-weight: 500;
    color: var(--ink);
    margin: 0 0 6px;
  }

  .empty p {
    margin: 0 0 16px;
    font-size: 13.5px;
  }

  .wallet {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-2);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 11px;
    font-variant-numeric: tabular-nums;
    box-shadow: var(--shadow);
  }

  .wallet b {
    color: var(--accent);
    font-weight: 600;
  }

  /* ticker */

  .ticker {
    border-bottom: 1px solid var(--line-soft);
    background: var(--card);
  }

  .ticker .wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-block: 7px;
    min-height: 32px;
    font-size: 12.5px;
    color: var(--ink-2);
  }

  .pulse {
    width: 7px;
    height: 7px;
    border-radius: 999px;
    background: var(--accent);
    flex: none;
    animation: ring 2.8s ease-out infinite;
  }

  @keyframes ring {
    0% { box-shadow: 0 0 0 0 var(--accent-soft); }
    70% { box-shadow: 0 0 0 7px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }

  #ticker {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    transition: opacity 0.35s ease;
  }

  #ticker b {
    font-weight: 500;
  }

  #ticker .who {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--accent);
  }

  #ticker time {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }

  .live {
    margin-left: auto;
    flex: none;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  main {
    padding-block: 26px 120px;
  }

  /* ---------------------------------------------------------------- hero */

  .hero {
    position: relative;
    border-radius: var(--r);
    overflow: hidden;
    border: 1px solid var(--line);
    background: #0b1016;
    margin-bottom: 38px;
    box-shadow: var(--shadow);
  }

  .hero-bg {
    position: absolute;
    inset: 0;
  }

  .hero-bg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 30%;
    filter: blur(2px);
    transform: scale(1.08);
    animation: drift 24s ease-in-out infinite alternate;
  }

  /* A slow push on the cover art, so the hero breathes instead of sitting
     still. Long and small on purpose: visible only if you stay a while. */
  @keyframes drift {
    from { transform: scale(1.08) translate3d(0, 0, 0); }
    to { transform: scale(1.16) translate3d(-1.5%, -2%, 0); }
  }

  .hero-inner > div,
  .hero-art {
    animation: rise 0.55s cubic-bezier(0.2, 0.7, 0.3, 1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: none; }
  }

  .hero.swap .hero-inner > div,
  .hero.swap .hero-art,
  .hero.swap .hero-bg img {
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  .dots {
    position: absolute;
    right: 18px;
    top: 18px;
    display: flex;
    gap: 6px;
  }

  .dots i {
    width: 6px;
    height: 6px;
    border-radius: 999px;
    background: #ffffff4d;
    transition: background 0.25s ease, width 0.25s ease;
  }

  .dots i.on {
    background: #ffffffdd;
    width: 18px;
  }

  /* The page fades its content in on every view change: short enough not to
     delay anything, long enough that navigation reads as movement. */
  #app > * {
    animation: rise 0.4s cubic-bezier(0.2, 0.7, 0.3, 1) both;
  }

  .card .art::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(115deg, transparent 38%, #ffffff26 48%, transparent 58%);
    transform: translateX(-120%);
    transition: transform 0.6s ease;
  }

  .card:hover .art::after {
    transform: translateX(120%);
  }

  .spark i {
    animation: grow 0.6s cubic-bezier(0.2, 0.7, 0.3, 1) both;
    transform-origin: bottom;
  }

  @keyframes grow {
    from { transform: scaleY(0.15); }
    to { transform: scaleY(1); }
  }

  /* Four bars that move only while audio is actually playing. */
  .eq {
    display: none;
    align-items: flex-end;
    gap: 2px;
    height: 15px;
    flex: none;
  }

  .dock.playing .eq {
    display: flex;
  }

  .eq i {
    width: 3px;
    background: var(--accent);
    border-radius: 1px;
    animation: bounce 0.9s ease-in-out infinite;
  }

  .eq i:nth-child(2) { animation-delay: 0.18s; }
  .eq i:nth-child(3) { animation-delay: 0.36s; }
  .eq i:nth-child(4) { animation-delay: 0.12s; }

  @keyframes bounce {
    0%, 100% { height: 4px; }
    50% { height: 15px; }
  }

  .dock-art img {
    transition: transform 0.4s ease;
  }

  .dock.playing .dock-art img {
    transform: scale(1.06);
  }

  .hero-scrim {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(100deg, #05080bf5 0%, #05080bdd 46%, #05080b55 100%),
      linear-gradient(0deg, #05080be8 0%, transparent 48%);
  }

  .hero-inner {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 150px;
    gap: 28px;
    align-items: end;
    padding: 32px 28px 26px;
    min-height: 320px;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #9fd8e2;
    margin-bottom: 12px;
  }

  .hero h1 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(30px, 5vw, 46px);
    line-height: 1.05;
    letter-spacing: -0.025em;
    margin: 0 0 12px;
    color: #ffffff;
    text-wrap: balance;
    max-width: 16ch;
  }

  .hero p {
    margin: 0 0 20px;
    color: #d7dee4;
    font-size: 15px;
    max-width: 52ch;
    line-height: 1.6;
  }

  .cta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
  }

  .hero-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin-top: 16px;
    font-family: var(--mono);
    font-size: 11.5px;
    color: #a9b6c0;
    font-variant-numeric: tabular-nums;
  }

  .hero-art {
    border-radius: var(--r-sm);
    overflow: hidden;
    box-shadow: var(--shadow-lift);
    aspect-ratio: 600 / 1080;
    border: 1px solid #ffffff22;
  }

  @media (max-width: 760px) {
    .hero-inner {
      grid-template-columns: minmax(0, 1fr);
      min-height: 0;
      padding: 24px 20px 22px;
    }
    .hero-art {
      display: none;
    }
  }

  /* buttons */

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 500;
    border-radius: 999px;
    padding: 9px 18px;
    background: var(--accent);
    color: var(--card);
    border: 1px solid transparent;
    transition: transform 0.15s ease, filter 0.15s ease;
    white-space: nowrap;
  }

  .btn:hover {
    filter: brightness(1.08);
    transform: translateY(-1px);
  }

  .btn[disabled] {
    opacity: 0.45;
    cursor: default;
    transform: none;
    filter: none;
  }

  .btn.ghost {
    background: transparent;
    color: #e8eef2;
    border-color: #ffffff55;
  }

  .btn.ghost:hover {
    filter: none;
    border-color: #ffffff99;
  }

  .btn.quiet {
    background: var(--card);
    color: var(--ink);
    border-color: var(--line);
    box-shadow: var(--shadow);
  }

  .btn.sm {
    font-size: 12.5px;
    padding: 6px 13px;
  }

  /* ------------------------------------------------------------ sections */

  .sec-head {
    display: flex;
    align-items: baseline;
    gap: 14px;
    margin-bottom: 16px;
  }

  h2 {
    font-family: var(--serif);
    font-size: 21px;
    font-weight: 500;
    letter-spacing: -0.015em;
    margin: 0;
  }

  .note {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    margin-left: auto;
    text-align: right;
  }

  /* trending */

  .rail {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 10px;
    margin-bottom: 40px;
  }

  .rail-item {
    display: flex;
    align-items: center;
    gap: 12px;
    text-align: left;
    padding: 11px 13px;
    border: 1px solid var(--line-soft);
    border-radius: var(--r-sm);
    background: var(--card);
    min-width: 0;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }

  .rail-item:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }

  .rank {
    font-family: var(--serif);
    font-size: 22px;
    line-height: 1;
    color: var(--accent);
    flex: none;
    width: 17px;
  }

  .rail-item .body {
    min-width: 0;
    flex: 1;
  }

  .rail-item .nm {
    display: block;
    font-size: 13.5px;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .rail-item .n {
    display: block;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .spark {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 20px;
    flex: none;
  }

  .spark i {
    width: 3px;
    border-radius: 1px;
    background: var(--accent);
    opacity: 0.3;
  }

  .spark i:last-child {
    opacity: 1;
  }

  /* -------------------------------------------------------------- shelf */

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(188px, 1fr));
    gap: 30px 24px;
  }

  .card {
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 0;
  }

  .art {
    position: relative;
    aspect-ratio: 600 / 1080;
    border-radius: var(--r-sm);
    overflow: hidden;
    background: var(--sunk);
    box-shadow: var(--shadow);
    transition: transform 0.22s cubic-bezier(0.2, 0.7, 0.3, 1), box-shadow 0.22s ease;
  }

  .card:hover .art {
    transform: translateY(-4px);
    box-shadow: var(--shadow-lift);
  }

  .art img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .badge {
    position: absolute;
    left: 9px;
    bottom: 9px;
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    padding: 4px 8px;
    border-radius: 999px;
    background: #080c10e0;
    color: #e9f2f4;
    border: 1px solid #ffffff1f;
  }

  .badge.gold {
    background: #2a1c09e8;
    color: #f0c889;
    border-color: #f0c88938;
  }

  .fab {
    position: absolute;
    right: 9px;
    bottom: 9px;
    width: 34px;
    height: 34px;
    border-radius: 999px;
    background: var(--accent);
    color: var(--card);
    display: grid;
    place-items: center;
    font-size: 11px;
    opacity: 0;
    transform: translateY(5px);
    transition: opacity 0.18s ease, transform 0.18s ease;
    box-shadow: var(--shadow-lift);
  }

  .card:hover .fab,
  .card:focus-within .fab {
    opacity: 1;
    transform: translateY(0);
  }

  .genres {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .card h3 {
    font-family: var(--serif);
    font-size: 18px;
    font-weight: 500;
    line-height: 1.22;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .card:hover h3 {
    color: var(--accent);
  }

  .card p {
    margin: 0;
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--muted);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card .meta {
    display: flex;
    gap: 10px;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  /* -------------------------------------------------------------- story */

  .back {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 20px;
  }

  .back:hover {
    color: var(--accent);
  }

  .story-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 296px;
    gap: 40px;
    align-items: start;
  }

  @media (max-width: 900px) {
    .story-grid {
      grid-template-columns: minmax(0, 1fr);
      gap: 26px;
    }
  }

  .story-top {
    display: grid;
    grid-template-columns: 156px minmax(0, 1fr);
    gap: 24px;
    margin-bottom: 30px;
  }

  @media (max-width: 560px) {
    .story-top {
      grid-template-columns: 104px minmax(0, 1fr);
      gap: 16px;
    }
  }

  .story-top h1 {
    font-family: var(--serif);
    font-size: clamp(26px, 4.2vw, 36px);
    font-weight: 500;
    line-height: 1.08;
    letter-spacing: -0.025em;
    margin: 0 0 10px;
    text-wrap: balance;
  }

  .author {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 14px;
  }

  .av {
    width: 28px;
    height: 28px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent-ink);
    display: grid;
    place-items: center;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    flex: none;
  }

  .author .nm {
    display: block;
    font-size: 13.5px;
    font-weight: 500;
  }

  .author .sub {
    display: block;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--muted);
  }

  .synopsis {
    font-family: var(--serif);
    font-size: 17px;
    line-height: 1.6;
    color: var(--ink-2);

        if (saved.unlocked) state.unlocked = saved.unlocked;
        if (saved.voice) state.voice = saved.voice;
      } catch (err) {
        /* private window or blocked storage: the defaults are fine */
      }
    }

    function save() {
      try {
        localStorage.setItem(
          'aw-demo',
          JSON.stringify({
            credits: state.credits,
            unlocked: state.unlocked,
            voice: state.voice,
          }),
        );
      } catch (err) {
        /* nothing to do */
      }
    }

    /* ----------------------------------------------------------- helpers */

    function esc(s) {
      return String(s).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }

    function mmss(sec) {
      if (!isFinite(sec) || sec < 0) sec = 0;
      var s = Math.round(sec);
      return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    }

    function num(n) {
      return n.toLocaleString('vi-VN');
    }

    function story(slug) {
      for (var i = 0; i < state.stories.length; i++) {
        if (state.stories[i].slug === slug) return state.stories[i];
      }
      return null;
    }

    function seedOf(slug) {
      return SEED[slug] || { reads: 0, price: 0, forks: [] };
    }

    function isUnlocked(slug) {
      return seedOf(slug).price === 0 || state.unlocked[slug] === true;
    }

    function locked(slug, i) {
      return i >= FREE_CHAPTERS && !isUnlocked(slug);
    }

    function voiceLabel(id) {
      for (var i = 0; i < VOICES.length; i++) {
        if (VOICES[i].id === id) return VOICES[i].label;
      }
      return id;
    }

    function cover(slug) {
      return './covers/' + slug + '.svg';
    }

    function clipFor(i) {
      return i % 2 === 0 ? './audio/s1.mp4' : './audio/s2.mp4';
    }

    function readyKey(slug, i) {
      return slug + ':' + i + ':' + state.voice;
    }

    function hasAudio(slug, i) {
      if (state.ready[readyKey(slug, i)]) return true;
      return state.voice === 'Kore' && i < PRERENDERED;
    }

    function estimate(ch) {
      if (state.voice.indexOf('piper:') === 0) {
        var pace = Number((/@([\d.]+)$/.exec(state.voice) || [0, 1])[1]);
        var speech = (ch.words / 276) * 60 * (1 + 0.55 * (pace - 1));
        return Math.round((speech / 5 + 3) * 1000);
      }
      return Math.round(20000 + ch.text.length * 6);
    }

    function hash(str) {
      var h = 2166136261;
      for (var i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return function () {
        h = Math.imul(h ^ (h >>> 15), 2246822507);
        h = Math.imul(h ^ (h >>> 13), 3266489909);
        return ((h ^= h >>> 16) >>> 0) / 4294967296;
      };
    }

    function pick(list, rand) {
      return list[Math.floor(rand() * list.length)];
    }

    function weekly(slug) {
      var rand = hash(slug);
      var bars = [];
      for (var i = 0; i < 8; i++) bars.push(0.3 + rand() * 0.7);
      return bars;
    }

    function commentsFor(slug, i) {
      var rand = hash(slug + ':' + i);
      var n = 2 + Math.floor(rand() * 3);
      var out = [];
      var used = {};
      for (var k = 0; k < n; k++) {
        var who = pick(HANDLES, rand);
        var body = pick(COMMENTS, rand);
        if (used[body]) continue;
        used[body] = true;
        out.push({
          who: who,
          body: body,
          mins: 8 + Math.floor(rand() * 2600),
          likes: Math.floor(rand() * 46),
        });
      }
      out.sort(function (a, b) {
        return a.mins - b.mins;
      });
      return out;
    }

    function ago(mins) {
      if (mins < 60) return mins + ' phút trước';
      if (mins < 1440) return Math.round(mins / 60) + ' giờ trước';
      return Math.round(mins / 1440) + ' ngày trước';
    }

    /* -------------------------------------------------------------- live */

    /**
     * The hero cycles through the three most-read stories.
     *
     * Only the hero is swapped, never the whole view: a re-render would reset
     * scroll and interrupt anything the reader was doing. It pauses whenever the
     * shelf is not on screen.
     */
    function startHero() {
      state.featured = state.stories
        .slice()
        .sort(function (a, b) {
          return seedOf(b.slug).reads - seedOf(a.slug).reads;
        })
        .slice(0, 3)
        .map(function (s) {
          return s.slug;
        });

      setInterval(function () {
        if (state.view !== 'shelf') return;
        var el = document.getElementById('hero');
        if (!el) return;
        state.featIdx = (state.featIdx + 1) % state.featured.length;
        el.classList.add('swap');
        setTimeout(function () {
          el.innerHTML = heroHtml(story(state.featured[state.featIdx]));
          el.classList.remove('swap');
          paintLive();
        }, 400);
      }, 7000);
    }

    function startLive() {
      state.stories.forEach(function (s) {
        var rand = hash(s.slug + ':live');
        state.listeners[s.slug] =
          40 + Math.floor(rand() * (seedOf(s.slug).reads / 180));
      });
      paintLive();
      setInterval(drift, 4200);
      tickerNext();
      setInterval(tickerNext, 5400);
    }

    function drift() {
      state.stories.forEach(function (s) {
        var n = state.listeners[s.slug];
        var step = Math.round((Math.random() - 0.45) * Math.max(3, n * 0.05));
        state.listeners[s.slug] = Math.max(11, n + step);
      });
      paintLive();
    }

    function paintLive() {
      var total = 0;
      state.stories.forEach(function (s) {
        total += state.listeners[s.slug] || 0;
      });
      var live = document.getElementById('live');
      if (live && total) live.textContent = num(total) + ' người đang nghe';

      var nodes = document.querySelectorAll('[data-live]');
      for (var i = 0; i < nodes.length; i++) {
        var slug = nodes[i].getAttribute('data-live');
        nodes[i].textContent = num(state.listeners[slug] || 0) + ' đang nghe';
      }
    }

    function tickerNext() {
      var el = document.getElementById('ticker');
      if (!el || !state.stories.length) return;
      var rand = hash(String(Date.now()));
      var s = state.stories[Math.floor(rand() * state.stories.length)];
      var act = pick(ACTIVITY, rand);
      var ch = 1 + Math.floor(rand() * s.chapters.length);
      var line =
        '<span class="who">@' +
        esc(pick(HANDLES, rand)) +
        '</span> ' +
        act.t +
        ' ' +
        (act.ch ? 'chương ' + ch + ' của ' : '') +
        '<b>' +
        esc(s.title) +
        '</b> <time>' +
        (1 + Math.floor(rand() * 40)) +
        ' phút trước</time>';

      el.style.opacity = '0';
      setTimeout(function () {
        el.innerHTML = line;
        el.style.opacity = '1';
      }, 240);
    }

    /* ------------------------------------------------------------ player */

    function openDock(slug, i) {
      var s = story(slug);
      state.now = { slug: slug, ch: i };
      document.getElementById('dock-img').src = cover(slug);
      document.getElementById('dock-title').textContent = s.chapters[i].title;
      document.getElementById('dock-sub').textContent =
        s.title + ' · ' + voiceLabel(state.voice);
      dock.hidden = false;
      requestAnimationFrame(function () {
        dock.classList.add('up');
      });

      player.src = clipFor(i);
      player.playbackRate = state.rate;
      player.play().catch(function () {
        /* autoplay refused: the dock's own play button still works */
      });
      paintPP();
      render();
    }

    function closeDock() {
      player.pause();
      dock.classList.remove('up');
      state.now = null;
      setTimeout(function () {
        dock.hidden = true;
      }, 280);
      render();
    }

    function paintPP() {
      document.getElementById('pp').textContent = player.paused ? '▶' : '❚❚';
      dock.classList.toggle('playing', !player.paused);
    }

    player.addEventListener('play', paintPP);
    player.addEventListener('pause', paintPP);
    player.addEventListener('loadedmetadata', function () {
      document.getElementById('t-end').textContent = mmss(player.duration);
    });
    player.addEventListener('timeupdate', function () {
      if (!player.duration) return;
      document.getElementById('t-now').textContent = mmss(player.currentTime);
      document.getElementById('seek').value = String(
        Math.round((player.currentTime / player.duration) * 1000),
      );
    });
    player.addEventListener('ended', function () {
      var now = state.now;
      if (!now) return;
      var s = story(now.slug);
      var next = now.ch + 1;
      if (next < s.chapters.length && !locked(now.slug, next) && hasAudio(now.slug, next)) {
        openDock(now.slug, next);
      }
    });

    document.getElementById('seek').addEventListener('input', function (e) {
      if (!player.duration) return;
      player.currentTime = (Number(e.target.value) / 1000) * player.duration;
    });

    /* --------------------------------------------------------- synthesis */

    function synthesise(slug, i, done) {
      var ch = story(slug).chapters[i];
      var real = estimate(ch);
      var wait = Math.min(Math.max(real / 7, 2200), 6000);
      var t0 = performance.now();

      state.job = { slug: slug, ch: i, p: 0.04, queued: true, timer: 0 };
      state.job.timer = setInterval(tick, 140);
      render();

      function tick() {
        var job = state.job;
        if (!job) return;
        var t = performance.now() - t0;
        if (job.queued && t > wait * 0.18) job.queued = false;

        var next = job.queued
          ? 0.04 + 0.1 * (1 - Math.exp(-t / 900))
          : 0.14 + 0.8 * (1 - Math.exp((-2.3 * (t - wait * 0.18)) / wait));
        job.p = Math.max(job.p, next);

        if (t >= wait) {
          job.p = 1;
          paintProgress();
          clearInterval(job.timer);
          state.job = null;
          state.ready[readyKey(slug, i)] = true;
          setTimeout(done, 420);
          return;
        }
        paintProgress();
      }
    }

    function paintProgress() {
      var job = state.job;
      var fill = document.querySelector('[data-fill]');
      if (!fill) return;
      var pct = Math.round((job ? job.p : 1) * 100);
      fill.style.width = pct + '%';
      var label = document.querySelector('[data-pct]');
      if (label) label.textContent = pct + '%';
      var msg = document.querySelector('[data-msg]');
      if (msg) msg.textContent = progressText(job, pct);
    }

    function progressText(job, pct) {
      if (!job) return 'Xong rồi';
      if (job.queued) return 'Đang xếp hàng…';
      if (pct < 30) return 'Đang chuẩn bị giọng đọc…';
      if (pct < 62) return 'Đang đọc chương truyện…';
      if (pct < 85) return 'Đang hoàn thiện âm thanh…';
      return 'Sắp xong rồi…';
    }

    function listen(slug, i) {
      if (locked(slug, i)) return;
      if (hasAudio(slug, i)) {
        openDock(slug, i);
        return;
      }
      synthesise(slug, i, function () {
        openDock(slug, i);
      });
    }

    /* --------------------------------------------------------------- nav */

    function go(view, slug, ch) {
      if (state.job) {
        clearInterval(state.job.timer);
        state.job = null;
      }
      state.view = view;
      state.slug = slug === undefined ? state.slug : slug;
      state.ch = ch === undefined ? 0 : ch;
      state.panel = false;
      render();
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    function render() {
      document.getElementById('wallet').innerHTML =
        '<b>' + state.credits + '</b> credit';
      if (state.view === 'shelf') app.innerHTML = shelf();
      else if (state.view === 'mine') app.innerHTML = mine();
      else if (state.view === 'story') app.innerHTML = storyView();
      else app.innerHTML = reader();

      document
        .getElementById('nav-shelf')
        .setAttribute('aria-current', state.view === 'shelf' ? 'true' : 'false');
      document
        .getElementById('nav-mine')
        .setAttribute('aria-current', state.view === 'mine' ? 'true' : 'false');
      paintLive();
    }

    /* ------------------------------------------------------------- views */

    function heroHtml(feat) {
      var dots = state.featured
        .map(function (slug, n) {
          return '<i class="' + (slug === feat.slug ? 'on' : '') + '"></i>';
        })
        .join('');
      return (
        '<span class="hero-bg"><img src="' + cover(feat.slug) + '" alt="" /></span>' +
        '<span class="hero-scrim"></span>' +
        '<div class="hero-inner"><div>' +
        '<div class="eyebrow">Truyện nổi bật</div>' +
        '<h1>' + esc(feat.title) + '</h1>' +
        '<p>' + esc(feat.synopsis) + '</p>' +
        '<div class="cta">' +
        '<button class="btn" data-listen="' + feat.slug + '">▶ Nghe chương 1</button>' +
        '<button class="btn ghost" data-story="' + feat.slug + '">Đọc truyện</button>' +
        '</div>' +
        '<div class="hero-meta"><span>' + feat.chapters.length + ' chương</span>' +
        '<span>' + Math.round(feat.words / WPM) + ' phút</span>' +
        '<span data-live="' + feat.slug + '">—</span></div>' +
        '</div>' +
        '<span class="hero-art"><img src="' + cover(feat.slug) +
        '" alt="Bìa ' + esc(feat.title) + '" /></span>' +
        '<span class="dots" aria-hidden="true">' + dots + '</span>' +
        '</div>'
      );
    }

    function shelf() {
      var feat = story(state.featured[state.featIdx]) || state.stories[0];
      var hero = '<section class="hero" id="hero">' + heroHtml(feat) + '</section>';

      var ranked = state.stories
        .slice()
        .sort(function (a, b) {
          return seedOf(b.slug).reads - seedOf(a.slug).reads;
        })
        .slice(0, 4)
        .map(function (s, n) {
          var bars = weekly(s.slug)
            .map(function (h) {
              return '<i style="height:' + Math.round(h * 20) + 'px"></i>';
            })
            .join('');
          return (
            '<button class="rail-item" data-story="' + s.slug + '">' +
            '<span class="rank">' + (n + 1) + '</span>' +
            '<span class="body"><span class="nm">' + esc(s.title) + '</span>' +
            '<span class="n" data-live="' + s.slug + '">—</span></span>' +
            '<span class="spark" aria-hidden="true">' + bars + '</span></button>'
          );
        })
        .join('');

      var cards = state.stories
        .map(function (s) {
          var seed = seedOf(s.slug);
          var badge = seed.price
            ? '<span class="badge gold">' + seed.price + ' credit</span>'
            : '<span class="badge">Miễn phí</span>';
          return (
            '<button class="card" data-story="' + s.slug + '">' +
            '<span class="art"><img src="' + cover(s.slug) + '" alt="Bìa ' +
            esc(s.title) + '" width="600" height="1080" loading="lazy" />' +
            badge +
            '<span class="fab" data-listen="' + s.slug + '">▶</span></span>' +
            '<span class="genres">' + esc(s.genres.join(' · ')) + '</span>' +
            '<h3>' + esc(s.title) + '</h3>' +
            '<p>' + esc(s.synopsis) + '</p>' +
            '<span class="meta"><span>' + s.chapters.length + ' chương</span>' +
            '<span>' + num(seed.reads) + ' lượt đọc</span></span></button>'
          );
        })
        .join('');

      return (
        hero +
        '<div class="sec-head"><h2>Đang được nghe nhiều</h2>' +
        '<span class="note">7 ngày qua</span></div>' +
        '<div class="rail">' + ranked + '</div>' +
        '<div class="sec-head"><h2>Tất cả truyện</h2>' +
        '<span class="note">' + state.stories.length +
        ' truyện · 3 chương đầu miễn phí</span></div>' +
        '<div class="grid">' + cards + '</div>' +
        foot()
      );
    }

    function mine() {
      var unlocked = state.stories.filter(function (s) {
        return state.unlocked[s.slug];
      });
      var heard = {};
      Object.keys(state.ready).forEach(function (k) {
        heard[k.split(':')[0]] = true;
      });
      var listened = state.stories.filter(function (s) {
        return heard[s.slug] && !state.unlocked[s.slug];
      });
      var all = unlocked.concat(listened);

      if (!all.length) {
        return (
          '<div class="sec-head"><h2>Kệ của tôi</h2></div>' +
          '<div class="empty"><h3>Kệ của bạn còn trống</h3>' +
          '<p>Truyện bạn mở khoá hoặc đã nghe sẽ nằm ở đây.</p>' +
          '<button class="btn" id="nav-shelf-2">Tìm truyện để nghe</button></div>' +
          foot()
        );
      }

      var cards = all
        .map(function (s) {
          var seed = seedOf(s.slug);
          return (
            '<button class="card" data-story="' + s.slug + '">' +
            '<span class="art"><img src="' + cover(s.slug) + '" alt="Bìa ' +
            esc(s.title) + '" width="600" height="1080" loading="lazy" />' +
            (state.unlocked[s.slug]
              ? '<span class="badge">Đã mở khoá</span>'
              : '<span class="badge">Đang nghe</span>') +
            '<span class="fab" data-listen="' + s.slug + '">▶</span></span>' +
            '<span class="genres">' + esc(s.genres.join(' · ')) + '</span>' +
            '<h3>' + esc(s.title) + '</h3>' +
            '<span class="meta"><span>' + s.chapters.length + ' chương</span></span>' +
            '</button>'
          );
        })
        .join('');

      return (
        '<div class="sec-head"><h2>Kệ của tôi</h2>' +
        '<span class="note">' + all.length + ' truyện</span></div>' +
        '<div class="grid">' + cards + '</div>' +
        foot()
      );
    }

    function storyView() {
      var s = story(state.slug);
      var seed = seedOf(s.slug);
      var open = isUnlocked(s.slug);
      var here = state.now && state.now.slug === s.slug;

      var rows = s.chapters
        .map(function (c, i) {
          var isLocked = locked(s.slug, i);
          var active = here && state.now.ch === i;
          var mark = isLocked ? '✦' : hasAudio(s.slug, i) ? '▶' : '♪';
          return (
            '<li><button class="row' + (active ? ' active' : '') + '" data-ch="' + i + '"' +
            (isLocked ? ' disabled' : '') + '>' +
            '<span class="idx">' + (i + 1) + '</span>' +
            '<span class="ico" aria-hidden="true">' + mark + '</span>' +
            '<span class="tt"><b>' + esc(c.title) + '</b>' +
            '<span>' + num(c.words) + ' từ</span></span>' +
            '<span class="right">' +
            (isLocked ? seed.price + ' credit' : mmss((c.words / WPM) * 60)) +
            '</span></button></li>'
          );
        })
        .join('');

      var unlockCard = open
        ? ''
        : '<div class="panelcard gold"><h3>Mở khoá cả truyện</h3>' +
          '<p>Ba chương đầu luôn miễn phí. Mở khoá một lần, đọc và nghe mãi mãi — người viết nhận 70%.</p>' +
          '<button class="btn sm" id="unlock"' +
          (state.credits < seed.price ? ' disabled' : '') + '>' +
          (state.credits < seed.price
            ? 'Cần ' + seed.price + ' credit'
            : 'Mở khoá · ' + seed.price + ' credit') +
          '</button></div>';

      var tree =
        '<ul class="tree"><li class="main"><span class="twig">┌</span>' +
        '<span><b>' + esc(s.title) + '</b>' +
        '<span class="who">' + esc(AUTHOR) + ' · ' + s.chapters.length +
        ' chương · nhánh chính</span></span></li>' +
        seed.forks
          .map(function (f, n) {
            return (
              '<li><span class="twig">' +
              (n === seed.forks.length - 1 ? '└' : '├') + '</span>' +
              '<span>' + esc(f.name) +
              '<span class="who">@' + esc(f.who) + ' · rẽ từ chương ' + f.at +
              ' · ' + f.len + ' chương</span></span></li>'
            );
          })
          .join('') +
        '</ul>';

      return (
        '<button class="back" id="back">← Khám phá</button>' +
        '<div class="story-grid"><div>' +
        '<div class="story-top">' +
        '<span class="art"><img src="' + cover(s.slug) + '" alt="Bìa ' +
        esc(s.title) + '" /></span>' +
        '<div><h1>' + esc(s.title) + '</h1>' +
        '<div class="author"><span class="av" aria-hidden="true">HP</span>' +
        '<span><span class="nm">' + esc(AUTHOR) + '</span>' +
        '<span class="sub">tác giả · ' + seed.forks.length + ' nhánh rẽ</span></span></div>' +
        '<p class="synopsis">' + esc(s.synopsis) + '</p>' +
        '<div class="pills">' +
        s.genres
          .map(function (g) {
            return '<span class="pill">' + esc(g) + '</span>';
          })
          .join('') +
        (open ? '<span class="pill">đã mở khoá</span>' : '') +
        '</div>' +
        '<div class="cta">' +
        '<button class="btn" data-listen="' + s.slug + '">▶ Nghe từ đầu</button>' +
        '<button class="btn quiet" data-ch="0">Đọc chương 1</button>' +
        '</div></div></div>' +
        '<div class="sec-head"><h2>Mục lục</h2>' +
        '<button class="gear" id="gear">' + esc(voiceLabel(state.voice)) +
        ' · ' + state.rate + '× ' + (state.panel ? '▴' : '▾') + '</button></div>' +
        (state.panel ? '<div class="narr">' + panel() + '</div>' : '') +
        '<ol class="chapters">' + rows + '</ol>' +
        '</div><aside class="side">' +
        unlockCard +
        '<div class="panelcard"><h3>Số liệu</h3>' +
        '<div class="statrow"><span>Lượt đọc</span><span>' + num(seed.reads) + '</span></div>' +
        '<div class="statrow"><span>Đang nghe</span><span data-live="' + s.slug + '">—</span></div>' +
        '<div class="statrow"><span>Số từ</span><span>' + num(s.words) + '</span></div>' +
        '<div class="statrow"><span>Thời lượng</span><span>' +
        Math.round(s.words / WPM) + ' phút</span></div></div>' +
        '<div class="panelcard"><h3>Các nhánh</h3>' + tree +
        '<button class="btn quiet sm" id="fork" style="margin-top:12px">Rẽ nhánh từ đây</button>' +
        '</div></aside></div>' +
        foot()
      );
    }

    function reader() {
      var s = story(state.slug);
      var i = state.ch;
      var c = s.chapters[i];
      var paras = c.text
        .split(/\n\n+/)
        .map(function (p) {
          return '<p>' + esc(p) + '</p>';
        })
        .join('');

      var narr;
      if (state.job && state.job.slug === s.slug && state.job.ch === i) {
        narr =
          '<div class="prog"><div class="prog-head"><span data-msg>Đang xếp hàng…</span>' +
          '<span data-pct>4%</span></div>' +
          '<div class="track"><div class="fill" data-fill></div></div></div>';
      } else {
        var playing = state.now && state.now.slug === s.slug && state.now.ch === i;
        narr =
          '<div class="narr-row">' +
          '<button class="btn sm" id="narrate">' +
          (playing
            ? '❚❚ Đang phát'
            : hasAudio(s.slug, i)
              ? '▶ Nghe chương này'
              : '♪ Tạo bản đọc') +
          '</button>' +
          '<span class="vname">' + mmss((c.words / WPM) * 60) + ' · ' +
          esc(voiceLabel(state.voice)) + '</span>' +
          '<button class="gear" id="gear">' + state.rate + '× ' +
          (state.panel ? '▴' : '▾') + '</button></div>';
      }

      var prevOk = i > 0;
      var nextOk = i + 1 < s.chapters.length && !locked(s.slug, i + 1);

      return (
        '<div class="reader">' +
        '<button class="back" id="back-story">← ' + esc(s.title) + '</button>' +
        '<div class="reader-top"><span>Chương ' + (i + 1) + ' / ' +
        s.chapters.length + '</span><span>' + num(c.words) + ' từ</span></div>' +
        '<h1>' + esc(c.title) + '</h1>' +
        '<div class="narr">' + narr + (state.panel ? panel() : '') + '</div>' +
        '<div class="prose">' + paras + '</div>' +
        '<div class="pager">' +
        '<button data-go="' + (i - 1) + '"' + (prevOk ? '' : ' disabled') + '>' +
        '<span class="lbl">Chương trước</span><span class="nm">' +
        (prevOk ? esc(s.chapters[i - 1].title) : '—') + '</span></button>' +
        '<button data-go="' + (i + 1) + '"' + (nextOk ? '' : ' disabled') + '>' +
        '<span class="lbl">Chương sau</span><span class="nm">' +
        (nextOk
          ? esc(s.chapters[i + 1].title)
          : i + 1 < s.chapters.length
            ? 'Cần mở khoá'
            : 'Hết truyện') +
        '</span></button></div>' +
        thread(s.slug, i) +
        foot() +
        '</div>'
      );
    }

    function thread(slug, i) {
      var mine = (state.posted[slug + ':' + i] || []).map(function (body) {
        return { who: 'bạn', body: body, mins: 0, likes: 0 };
      });
      var all = mine.concat(commentsFor(slug, i));
      var items = all
        .map(function (c) {
          return (
            '<div class="cm"><span class="av" aria-hidden="true">' +
            esc(c.who.slice(0, 2)) + '</span><div>' +
            '<div class="cm-head"><b>' +
            (c.who === 'bạn' ? 'Bạn' : '@' + esc(c.who)) + '</b>' +
            '<time>' + (c.mins === 0 ? 'vừa xong' : ago(c.mins)) + '</time></div>' +
            '<p>' + esc(c.body) + '</p>' +
            '<div class="likes">♥ ' + c.likes + '</div></div></div>'
          );
        })
        .join('');

      return (
        '<div class="sec-head" style="margin-top:40px"><h2>Bình luận</h2>' +
        '<span class="note">' + all.length + '</span></div>' +
        '<div class="thread">' + items +
        '<div class="composer"><input id="say" placeholder="Viết bình luận…" autocomplete="off" />' +
        '<button class="btn sm" id="post">Gửi</button></div></div>'
      );
    }

    function panel() {
      var groups = GROUPS.map(function (g) {
        return (
          '<div class="vgroup"><span class="vlabel">' + g.title + '</span>' +
          VOICES.filter(function (v) {
            return v.p === g.p;
          })
            .map(function (v) {
              return (
                '<button class="voice" data-voice="' + v.id + '" aria-pressed="' +
                (state.voice === v.id) + '">' + esc(v.label) + '</button>'
              );
            })
            .join('') +
          '</div>'
        );
      }).join('');

      var rates = [1, 1.25, 1.5, 1.75, 2]
        .map(function (r) {
          return (
            '<button class="rate" data-rate="' + r + '" aria-pressed="' +
            (state.rate === r) + '">' + r + '×</button>'
          );
        })
        .join('');

      return (
        '<div class="panel">' + groups +
        '<div class="vgroup"><span class="vlabel">Tốc độ đọc</span>' + rates +
        '</div></div>'
      );
    }

    function foot() {
      return (
        '<footer class="foot">' +
        '<span>3 chương đầu được tạo sẵn khi xuất bản</span>' +
        '<span>Chương sau tạo trước khi bạn nghe tới</span>' +
        '<span>Giọng Gemini hoặc Piper tự chạy</span>' +
        '<span>Nội dung và số liệu trong trang là dữ liệu mẫu</span>' +
        '</footer>'
      );
    }

    /* ------------------------------------------------------------ events */

    document.addEventListener('click', function (e) {
      var listenEl = e.target.closest('[data-listen]');
      if (listenEl) {
        e.stopPropagation();
        listen(listenEl.getAttribute('data-listen'), 0);
        return;
      }

      var t = e.target.closest('button');
      if (!t) return;

      if (t.id === 'home' || t.id === 'back' || t.id === 'nav-shelf' || t.id === 'nav-shelf-2') {
        go('shelf', null);
      } else if (t.id === 'nav-mine') {
        go('mine', null);
      } else if (t.dataset.story) {
        go('story', t.dataset.story);
      } else if (t.id === 'back-story') {
        go('story', state.slug);
      } else if (t.dataset.ch !== undefined) {
        go('reader', state.slug, Number(t.dataset.ch));
      } else if (t.dataset.go !== undefined) {
        go('reader', state.slug, Number(t.dataset.go));
      } else if (t.id === 'gear') {
        state.panel = !state.panel;
        render();
      } else if (t.dataset.voice) {
        state.voice = t.dataset.voice;
        save();
        render();
      } else if (t.dataset.rate) {
        state.rate = Number(t.dataset.rate);
        player.playbackRate = state.rate;
        render();
      } else if (t.id === 'narrate') {
        if (state.now && state.now.slug === state.slug && state.now.ch === state.ch) {
          if (player.paused) player.play();
          else player.pause();
        } else {
          listen(state.slug, state.ch);
        }
      } else if (t.id === 'pp') {
        if (player.paused) player.play();
        else player.pause();
      } else if (t.id === 'dock-close') {
        closeDock();
      } else if (t.id === 'unlock') {
        var price = seedOf(state.slug).price;
        if (state.credits >= price) {
          state.credits -= price;
          state.unlocked[state.slug] = true;
          save();
          render();
        }
      } else if (t.id === 'post') {
        var box = document.getElementById('say');
        var text = box && box.value.trim();
        if (text) {
          var key = state.slug + ':' + state.ch;
          state.posted[key] = [text].concat(state.posted[key] || []);
          render();
        }
      } else if (t.id === 'fork') {
        var seed = seedOf(state.slug);
        seed.forks = seed.forks.concat([
          { name: 'Nhánh của bạn', who: 'bạn', at: FREE_CHAPTERS, len: 0 },
        ]);
        render();
      }
    });

    /* -------------------------------------------------------------- boot */

    load();

    fetch('./data/stories.json')
      .then(function (r) {
        return r.json();
      })
      .then(function (data) {
        state.stories = data;
        startHero();
        render();
        startLive();
      })
      .catch(function () {
        app.innerHTML =
          '<div class="sec-head"><h2>Không tải được dữ liệu truyện</h2></div>' +
          '<p style="color:var(--muted)">Thử tải lại trang.</p>';
      });
  })();
</script>

</body>
</html>
